; PlatformIO Project Configuration File
;
; LilyGO TTGO T-Display (original ESP32) with HLK-LD2450 radar

[env:lilygo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino

; Original TTGO T-Display has an ESP32 and 4 MB flash (no PSRAM).
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio
board_build.filesystem = spiffs
data_dir = data

; TFT_eSPI setup for the onboard ST7789V (135x240 native, landscape rotation).
build_flags =
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DSPI_FREQUENCY=27000000

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Onboard ST7789V color display
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; Upload settings
upload_speed = 921600
